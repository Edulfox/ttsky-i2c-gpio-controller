# Tiny Tapeout project information
project:
  title:        "I2C GPIO Controller"
  author:       "Eduardo Norambuena"
  discord:      ""
  description:  "I2C GPIO expander with interrupts, event registers, and a 32-byte scratchpad"
  language:     "Verilog"
  clock_hz:     50000000

  # Initial allocation. Review after the first successful GDS hardening run.
  tiles: "2x2"

  top_module:  "tt_um_eduardon_i2c_gpio_controller"

  source_files:
    - "project.v"
    - "i2c_target.v"
    - "register_bank.v"
    - "interrupt_controller.v"
    - "gpio_controller.v"
    - "scratchpad_ram.v"

pinout:
  # Inputs
  ui[0]: "INPUT0"
  ui[1]: "INPUT1"
  ui[2]: "INPUT2"
  ui[3]: "INPUT3"
  ui[4]: "INPUT4"
  ui[5]: "INPUT5"
  ui[6]: "INPUT6"
  ui[7]: "INPUT7"

  # Outputs
  uo[0]: "OUTPUT0"
  uo[1]: "OUTPUT1"
  uo[2]: "OUTPUT2"
  uo[3]: "OUTPUT3"
  uo[4]: "OUTPUT4"
  uo[5]: "OUTPUT5"
  uo[6]: "OUTPUT6"
  uo[7]: "OUTPUT7"

  # Bidirectional pins
  uio[0]: "IRQ_N / GPIO0"
  uio[1]: "GPIO1"
  uio[2]: "I2C SCL"
  uio[3]: "I2C SDA"
  uio[4]: "GPIO4"
  uio[5]: "GPIO5"
  uio[6]: "GPIO6"
  uio[7]: "GPIO7"

# Do not change!
yaml_version: 6
